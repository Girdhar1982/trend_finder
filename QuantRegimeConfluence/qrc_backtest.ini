; ==========================================================================
;  Strategy Tester config for QuantRegimeConfluenceEA
;
;  RUN IT:
;    1. Close MetaTrader 5 completely (one instance per data folder).
;    2. "C:\Program Files\Go MetaTrader 5\terminal64.exe" /config:"c:\myfiles\training_folder\QuantRegimeConfluence\qrc_backtest.ini"
;    3. The terminal opens, runs the test, writes the report, and exits
;       (ShutdownTerminal=1).
;    4. Report lands in the terminal folder as QRC_Report.html
;
;  Model values:
;    0 = Every tick            1 = 1 minute OHLC        2 = Open prices only
;    3 = Math calculations     4 = Every tick based on real ticks
;
;  Model=2 (Open prices only) is INVALID for this EA - exits are SL/TP hits
;  inside a bar, so the intrabar path matters. Use 1 for speed, 4 for truth.
; ==========================================================================

[Tester]
Expert=QuantRegimeConfluenceEA
Symbol=EURUSD
Period=M15
Model=1
Optimization=0
ForwardMode=0

; --- warm-up note: the indicator needs ~117 bars of H1 AND H4 before this
; --- date, so do not start the test at the very beginning of your history
FromDate=2024.01.01
ToDate=2026.06.30

Deposit=10000
Currency=USD
Leverage=1:100

; ExecutionMode: 0 = normal delay, or milliseconds of latency to simulate
ExecutionMode=0

Visual=0
Report=QRC_Report
ReplaceReport=1
ShutdownTerminal=1

; --- Optional: point at a saved .set file to override EA inputs
; ExpertParameters=qrc_defaults.set
