; ==========================================================================
;  HTF_Zone_Grid_3Level_EA - baseline backtest
;
;  RUN IT:
;    1. Close MetaTrader 5 completely (one instance per data folder).
;    2. Copy HTF_Zone_Grid_3Level_EA.ex5 AND the four .mqh files into
;         <data>\MQL5\Experts\HTF_Zone_Grid\
;       This setup is copy-based, not symlinked.
;    3. DELETE <data>\MQL5\Profiles\Tester\HTF_Zone_Grid_3Level_EA.set
;       whenever a source default has changed. MT5 silently reuses the
;       saved set over recompiled defaults, with no warning anywhere.
;    4. "C:\Program Files\Go MetaTrader 5\terminal64.exe" /config:"<this file>"
;    5. Read results from <data>\Tester\logs\<yyyymmdd>.log  (UTF-16).
;       Report= produced no file on build 6140 - do not rely on it.
;
;  BEFORE TRUSTING ANY RESULT: find the EA "resolved config" line in the
;  log and check the inputs it actually received.
;
;  M5 is the signal timeframe. Model=1 (control points) is only adequate
;  for a first look - the grid uses LIMIT orders inside a few-ATR band,
;  so fill realism matters. Re-run anything promising with Model=0
;  (every tick) or real ticks before believing the fill rate on L2/L3.
; ==========================================================================

[Tester]
Expert=HTF_Zone_Grid\HTF_Zone_Grid_3Level_EA
Symbol=XAUUSD
Period=M5
Model=1
Optimization=0
ForwardMode=0
FromDate=2024.01.01
ToDate=2026.06.30

Deposit=10000
Currency=USD
Leverage=1:100

ExecutionMode=0

Visual=0
ShutdownTerminal=1
